[project]
name = "knowledge-base"
version = "0.1.0"
description = "Knowledge store (Postgres + pgvector, or in-memory), ingestion and hybrid retrieval for SOPs"
requires-python = ">=3.12"
dependencies = [
  "pgvector>=0.3",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "poc-common[llm]",
  "sop-kit",
]

[tool.uv.sources]
poc-common = { workspace = true }
sop-kit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_base"]
