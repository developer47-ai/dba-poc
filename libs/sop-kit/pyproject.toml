[project]
name = "sop-kit"
version = "0.1.0"
description = "SOP document model: parse Markdown SOPs, validate their procedure graph, chunk them for search"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sop_kit"]
