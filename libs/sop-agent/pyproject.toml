[project]
name = "sop-agent"
version = "0.1.0"
description = "SOP-guided specialist agent engine: LangGraph workflow, outcome decisions, approvals, SSE service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "langgraph>=0.6",
  "langchain-core>=0.3",
  "uvicorn>=0.30",
  "poc-common[llm]",
]

[tool.uv.sources]
poc-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sop_agent"]
