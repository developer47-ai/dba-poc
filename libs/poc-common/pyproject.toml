[project]
name = "poc-common"
version = "0.1.0"
description = "Shared building blocks for the DBA POC services: settings, logging, events, LLM and MCP helpers"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "uvicorn>=0.30",
  "mcp>=1.9,<2",
]

[project.optional-dependencies]
llm = ["langchain-openai>=0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poc_common"]
