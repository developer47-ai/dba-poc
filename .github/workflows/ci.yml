name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # Real Postgres + pgvector so the knowledge-store contract tests also run against it.
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: dba
          POSTGRES_PASSWORD: dba_local_pw
          POSTGRES_DB: dba
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dba -d dba"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install workspace
        run: uv sync --locked --extra llm --all-packages

      - name: Lint
        run: uv run ruff check .

      - name: Validate the SOP knowledge library
        run: uv run python -m sop_kit knowledge

      - name: Unit and integration tests (scripted model, real pgvector)
        env:
          RUN_PG_TESTS: "1"
          DATABASE_URL: postgresql://dba:dba_local_pw@localhost:5432/dba
        run: uv run pytest -q -rs

  platform:
    name: Containers, local LLM and end-to-end chat
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Start platform (Ollama, Postgres + pgvector, Valkey)
        run: docker compose up -d --wait ollama postgres valkey

      - name: Download models
        run: docker compose run --rm ollama-init

      - name: Smoke test
        run: bash scripts/smoke-test.sh

      - name: Build and start the whole product
        run: docker compose up -d --build

      - name: End-to-end troubleshooting conversation (real model, streamed)
        run: python3 scripts/e2e_check.py

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install workspace
        run: uv sync --locked --extra llm --all-packages

      # Small local models are not fully deterministic; report but do not fail the build.
      - name: Agent tests with the real model (informational)
        continue-on-error: true
        env:
          RUN_LLM_TESTS: "1"
        run: uv run pytest -q -m llm -rA

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 300

      - name: Stop platform
        if: always()
        run: docker compose down -v
