# DBA POC - the whole product on one machine.
#   docker compose up -d            # first run builds images and downloads ~3.5 GB of models
#   open http://localhost:8501      # expert console
#   ./scripts/smoke-test.ps1 (.sh)  # platform checks;  python scripts/e2e_check.py  # full chat

name: dba-poc

x-service-env: &service-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LLM_BASE_URL: http://ollama:11434/v1
  OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
  OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
  LLM_THINKING: ${LLM_THINKING:-false}
  NETWORK_SIMULATOR_URL: http://network-simulator:8300
  DIAGNOSTICS_MCP_URL: http://network-diagnostics-mcp:8101/mcp
  KNOWLEDGE_MCP_URL: http://knowledge-mcp:8105/mcp
  KNOWLEDGE_URL: http://knowledge-mcp:8105
  DOCLING_URL: http://docling:5001
  SCHEDULING_MCP_URL: http://scheduling-mcp:8103/mcp
  INHOME_AGENT_URL: http://inhome-agent:8201
  ACCESS_PON_AGENT_URL: http://access-pon-agent:8202
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  JAEGER_UI_URL: http://localhost:${JAEGER_UI_PORT:-16686}
  ORCHESTRATOR_URL: http://orchestrator:8000
  DATABASE_URL: postgresql://${POSTGRES_USER:-dba}:${POSTGRES_PASSWORD:-dba_local_pw}@postgres:5432/${POSTGRES_DB:-dba}
  KNOWLEDGE_DIR: /app/knowledge
  SESSION_STORE: ${SESSION_STORE:-postgres}

x-health: &health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 15s

services:
  # ---- Application ---------------------------------------------------------------------------
  chat-ui:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { PACKAGE: chat-ui, MODULE: chat_ui }
    image: dba-poc/chat-ui:local
    container_name: dba-chat-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHAT_UI_PORT:-8501}:8501"
    environment:
      <<: *service-env
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
    depends_on:
      orchestrator: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8501/_stcore/health', timeout=4)"]

  orchestrator:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { PACKAGE: orchestrator-agent, MODULE: orchestrator }
    image: dba-poc/orchestrator:local
    container_name: dba-orchestrator
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ORCHESTRATOR_PORT:-8000}:8000"
    environment: *service-env
    depends_on:
      jaeger: { condition: service_started }
      postgres: { condition: service_healthy }
      inhome-agent: { condition: service_healthy }
      access-pon-agent: { condition: service_healthy }
      network-simulator: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=4)"]

  inhome-agent:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { PACKAGE: inhome-agent, MODULE: inhome_agent }
    image: dba-poc/inhome-agent:local
    container_name: dba-inhome-agent
    restart: unless-stopped
    environment: *service-env
    depends_on:
      jaeger: { condition: service_started }
      network-diagnostics-mcp: { condition: service_healthy }
      knowledge-mcp: { condition: service_healthy }
      scheduling-mcp: { condition: service_healthy }
      ollama: { condition: service_healthy }
      ollama-init: { condition: service_completed_successfully }
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8201/health', timeout=4)"]

  access-pon-agent:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { PACKAGE: access-pon-agent, MODULE: access_pon_agent }
    image: dba-poc/access-pon-agent:local
    container_name: dba-access-pon-agent
    restart: unless-stopped
    environment: *service-env
    depends_on:
      jaeger: { condition: service_started }
      network-diagnostics-mcp: { condition: service_healthy }
      knowledge-mcp: { condition: service_healthy }
      scheduling-mcp: { condition: service_healthy }
      ollama: { condition: service_healthy }
      ollama-init: { condition: service_completed_successfully }
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8202/health', timeout=4)"]
  network-diagnostics-mcp:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { PACKAGE: network-diagnostics-mcp, MODULE: network_diagnostics_mcp }
    image: dba-poc/network-diagnostics-mcp:local
    container_name: dba-network-diagnostics-mcp
    restart: unless-stopped
    environment: *service-env
    depends_on:
      network-simulator: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8101/health', timeout=4)"]

  scheduling-mcp:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { PACKAGE: scheduling-mcp, MODULE: scheduling_mcp }
    image: dba-poc/scheduling-mcp:local
    container_name: dba-scheduling-mcp
    restart: unless-stopped
    environment: *service-env
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8103/health', timeout=4)"]
  network-simulator:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { PACKAGE: network-simulator, MODULE: network_simulator }
    image: dba-poc/network-simulator:local
    container_name: dba-network-simulator
    restart: unless-stopped
    environment:
      <<: *service-env
      SIMULATOR_SCENARIO_DIR: /app/data/scenarios
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8300/health', timeout=4)"]

  # ---- Observability -------------------------------------------------------------------------
  # Every chat turn is one distributed trace (orchestrator -> agents -> LLM and MCP calls).
  # In-memory storage: traces are gone after a restart, which is fine for a demo.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: dba-jaeger
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
  # ---- Document processing -------------------------------------------------------------------
  # Docling (official docling-serve image, CPU): PDF / Word / PowerPoint -> Markdown, which the
  # knowledge service turns into searchable, citable reference documents.
  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.38.1
    container_name: dba-docling
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOCLING_PORT:-5001}:5001"
  # ---- Knowledge (RAG) -----------------------------------------------------------------------
  # One-shot job: validate, chunk and embed knowledge/ into Postgres + pgvector (skips unchanged).
  kb-ingestion:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { PACKAGE: knowledge-base, MODULE: knowledge_base.ingest }
    image: dba-poc/kb-ingestion:local
    container_name: dba-kb-ingestion
    restart: "no"
    environment: *service-env
    depends_on:
      postgres: { condition: service_healthy }
      ollama-init: { condition: service_completed_successfully }

  knowledge-mcp:
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args: { PACKAGE: knowledge-mcp, MODULE: knowledge_mcp }
    image: dba-poc/knowledge-mcp:local
    container_name: dba-knowledge-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KNOWLEDGE_MCP_PORT:-8105}:8105"
    environment: *service-env
    depends_on:
      kb-ingestion: { condition: service_completed_successfully }
      ollama: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8105/health', timeout=4)"]

  # ---- Platform ------------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.40.6
    container_name: dba-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      # One request slot is fastest for a single user on CPU; raise it for parallel users.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
      # Room for the system prompt, tool schemas, tool results and history without silent cuts.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s

  # One-shot job: downloads the chat and embedding models into the ollama volume.
  ollama-init:
    image: ollama/ollama:0.40.6
    container_name: dba-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Pulling chat model: $$OLLAMA_CHAT_MODEL"
        ollama pull "$$OLLAMA_CHAT_MODEL"
        echo "Pulling embedding model: $$OLLAMA_EMBED_MODEL"
        ollama pull "$$OLLAMA_EMBED_MODEL"
        echo "Warming up $$OLLAMA_CHAT_MODEL (loads it into memory for the first chat)"
        ollama run "$$OLLAMA_CHAT_MODEL" "Reply with OK." > /dev/null
        echo "Models ready."

  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    container_name: dba-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dba_local_pw}
      POSTGRES_DB: ${POSTGRES_DB:-dba}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  valkey:
    image: valkey/valkey:9.0.6-alpine
    container_name: dba-valkey
    restart: unless-stopped
    command: ["valkey-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ollama_models:
  postgres_data:
