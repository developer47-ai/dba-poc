[project]
name = "dba-poc"
version = "0.1.0"
description = "Local multi-agent connectivity troubleshooting POC (workspace root)"
requires-python = ">=3.12"
dependencies = [
  "poc-common", "network-simulator", "network-diagnostics-mcp", "inhome-agent",
  "orchestrator-agent", "chat-ui",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "libs/*", "services/network-simulator", "services/mcp/*", "services/agents/*",
  "services/orchestrator-agent", "services/chat-ui",
]

[tool.uv.sources]
poc-common = { workspace = true }
network-simulator = { workspace = true }
network-diagnostics-mcp = { workspace = true }
inhome-agent = { workspace = true }
orchestrator-agent = { workspace = true }
chat-ui = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["libs", "services"]
markers = ["llm: needs a running Ollama and the models (set RUN_LLM_TESTS=1)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
  "poc_common", "network_simulator", "network_diagnostics_mcp", "inhome_agent", "orchestrator",
  "chat_ui",
]
