[project]
name = "inhome-agent"
version = "0.1.0"
description = "In-Home specialist agent: diagnoses modem, Wi-Fi and in-home device problems via MCP tools"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "langgraph>=0.6",
  "langchain-core>=0.3",
  "uvicorn>=0.30",
  "poc-common[llm]",
]

[tool.uv.sources]
poc-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inhome_agent"]
