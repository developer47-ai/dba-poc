[project]
name = "inhome-agent"
version = "0.1.0"
description = "In-Home specialist agent: modem, Wi-Fi and in-home device problems (SOP-guided)"
requires-python = ">=3.12"
dependencies = [
  "sop-agent",
  "poc-common[llm]",
]

[tool.uv.sources]
sop-agent = { workspace = true }
poc-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inhome_agent"]
