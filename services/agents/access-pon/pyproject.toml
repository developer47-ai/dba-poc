[project]
name = "access-pon-agent"
version = "0.1.0"
description = "Access-PON specialist agent: fiber access problems between the OLT and the customer's ONT (SOP-guided)"
requires-python = ">=3.12"
dependencies = [
  "sop-agent",
  "poc-common[llm]",
]

[tool.uv.sources]
sop-agent = { workspace = true }
poc-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/access_pon_agent"]
