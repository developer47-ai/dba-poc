[project]
name = "orchestrator-agent"
version = "0.1.0"
description = "Orchestrator: sessions, routing to specialist agents and SSE relay to the chat UI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "poc-common",
]

[tool.uv.sources]
poc-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]
