[project]
name = "network-simulator"
version = "0.1.0"
description = "Stateful fake telco network used as the POC backend (scenario customers, diagnostics, remote actions)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "pyyaml>=6",
  "uvicorn>=0.30",
  "poc-common",
]

[tool.uv.sources]
poc-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/network_simulator"]
