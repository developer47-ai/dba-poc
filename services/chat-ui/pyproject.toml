[project]
name = "chat-ui"
version = "0.1.0"
description = "Expert console: Streamlit chat UI with live streaming of agent activity and answers"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "streamlit>=1.40",
  "poc-common",
]

[tool.uv.sources]
poc-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_ui"]
