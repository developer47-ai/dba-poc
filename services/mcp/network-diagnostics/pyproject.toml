[project]
name = "network-diagnostics-mcp"
version = "0.1.0"
description = "MCP server exposing network diagnostic and remote-action tools (backed by the network simulator)"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "mcp>=1.9,<2",
  "poc-common",
]

[tool.uv.sources]
poc-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/network_diagnostics_mcp"]
