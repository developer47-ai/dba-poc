[project]
name = "scheduling-mcp"
version = "0.1.0"
description = "MCP server (stub): engineer appointment slots and bookings"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.9,<2",
  "poc-common",
]

[tool.uv.sources]
poc-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scheduling_mcp"]
