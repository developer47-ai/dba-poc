[project]
name = "knowledge-mcp"
version = "0.1.0"
description = "MCP server: knowledge search (hybrid RAG) and step-by-step SOP navigation"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4",
  "mcp>=1.9,<2",
  "knowledge-base",
  "poc-common",
  "sop-kit",
]

[tool.uv.sources]
knowledge-base = { workspace = true }
poc-common = { workspace = true }
sop-kit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_mcp"]
